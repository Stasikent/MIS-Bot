name: Final audit fixes

on:
  push:
    branches:
      - major-update-2026-08
    paths:
      - '.audit_patch/**'

permissions:
  contents: write

jobs:
  audit-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: major-update-2026-08
          fetch-depth: 0
      - name: Apply audit fixes
        run: python .audit_patch/apply.py
      - name: Compile affected Python
        run: python -m py_compile services/runtime_paths.py gui/workplace_setup_wizard.py gui/click_map_technical_window.py project/bot_mode1_current.py project/xray_flow.py gui/main_window.py
      - name: Commit verified fixes and remove helper
        shell: bash
        run: |
          rm -rf .audit_patch .github/workflows/audit-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "fix: final audit of workplace setup and multi-monitor click map"
          git push origin HEAD:major-update-2026-08
