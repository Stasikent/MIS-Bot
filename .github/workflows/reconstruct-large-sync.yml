name: Reconstruct large sync files

on:
  push:
    branches:
      - major-update-2026-08
    paths:
      - '.sync_large/**'
      - '.sync_patch/**'

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: major-update-2026-08
          fetch-depth: 0

      - name: Apply verified source patch
        shell: bash
        run: |
          set -euxo pipefail
          python .sync_patch/runtime_patch.py
          grep -q '"f2": 0x71' project/bot_mode1_current.py
          grep -q 'current_offset = offset' project/bot_mode1_current.py
          grep -q 'if not _win32_click(x, y, clicks=clicks, interval=0.15)' project/bot_mode1_current.py
          python -m py_compile project/bot_mode1_current.py project/xray_flow.py gui/main_window.py
          git diff --check
          git diff -- project/bot_mode1_current.py

      - name: Commit patched runtime
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/bot_mode1_current.py
          if git diff --cached --quiet; then
            echo "ERROR: runtime patch produced no staged change"
            exit 1
          fi
          git commit -m "fix: harden Win32 click and key dispatch"
          git push origin HEAD:major-update-2026-08
