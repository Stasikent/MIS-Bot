name: Reconstruct large sync files

on:
  push:
    branches:
      - major-update-2026-08
    paths:
      - '.sync_large/**'
      - '.sync_patch/**'

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: major-update-2026-08
          fetch-depth: 0

      - name: Reconstruct and verify large files
        shell: python
        run: |
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          jobs = [
              (
                  Path('.sync_large/main_window_gz'),
                  Path('gui/main_window.py'),
                  'd11bd96ccd19d23ad744e1cc6db9227d7aabbb499eaba0302b6a4fd4b37a59d9',
              ),
              (
                  Path('.sync_large/bot_mode1_current_gz'),
                  Path('project/bot_mode1_current.py'),
                  'cf754fc4d406679b7d321e784ca42e6f6ad1b9d03f956fea8eb8e4c27fe7963b',
              ),
          ]

          completed = 0
          for parts_dir, target, expected_sha256 in jobs:
              parts = sorted(parts_dir.glob('part-*.b64'))
              done_marker = parts_dir / 'READY'
              if not done_marker.exists():
                  continue
              if not parts:
                  raise SystemExit(f'READY exists but no chunks for {target}')
              encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
              packed = base64.b64decode(encoded, validate=True)
              data = gzip.decompress(packed)
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected_sha256:
                  raise SystemExit(f'SHA256 mismatch for {target}: {actual} != {expected_sha256}')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              completed += 1
              print(f'OK: {target} {len(data)} bytes sha256={actual}')

          if completed == 0:
              print('No READY large payloads')

      - name: Apply verified source patches
        shell: bash
        run: |
          set -e
          if [ -f .sync_patch/runtime_patch.py ]; then
            python .sync_patch/runtime_patch.py
          else
            echo "No runtime patch"
          fi

      - name: Compile patched Python sources
        shell: bash
        run: |
          python -m py_compile project/bot_mode1_current.py project/xray_flow.py gui/main_window.py

      - name: Commit reconstructed or patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .sync_large/main_window_gz/READY ]; then rm -rf .sync_large/main_window .sync_large/main_window_gz; fi
          if [ -f .sync_large/bot_mode1_current_gz/READY ]; then rm -rf .sync_large/bot_mode1_current_gz; fi
          git add -A gui/main_window.py project/bot_mode1_current.py project/xray_flow.py .sync_large || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "fix: harden Win32 click and key dispatch"
          git push origin HEAD:major-update-2026-08
